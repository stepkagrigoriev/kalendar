apiVersion: batch/v1
kind: Job
metadata:
  name: database-setup
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: database-setup
          image: kalendar-database-setup
          envFrom:
            - secretRef:
                name: kalendar
          env:
            - name: MONGO_HOST
              value: mongodb:27017
